---
- name: Check if timesyncd service exists
  ansible.builtin.systemd:
    name: systemd-timesyncd
  register: timesyncd_status
  failed_when: false
  changed_when: false
  when: chrony_timesyncd_remove

- ansible.builtin.import_tasks: clean.yml
  # systemd module returns status={} when the unit is missing, so status is always defined
  when: chrony_timesyncd_remove and (timesyncd_status.status.LoadState | default('not-found')) != 'not-found'

- name: Install chrony
  ansible.builtin.apt:
    name: chrony
    state: present

- name: Ensure chrony running
  ansible.builtin.systemd:
    name: chrony
    state: started
    enabled: true
